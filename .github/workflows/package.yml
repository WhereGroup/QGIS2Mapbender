name: Test QGIS plugin package

on:
  workflow_dispatch:

  push:
    branches:
      - "ci/release-pipeline"

  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/package.yml"
      - "qgis2mapbender/**"

permissions:
  contents: read

env:
  PLUGIN_DIRECTORY: "qgis2mapbender"
  QGIS_PLUGIN_CI_VERSION: "2.9.*"

jobs:
  package:
    name: Package plugin without publishing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install qgis-plugin-ci
        run: |
          python -m pip install \
            "qgis-plugin-ci==${{ env.QGIS_PLUGIN_CI_VERSION }}"

      - name: Package plugin
        run: |
          qgis-plugin-ci package latest \
            --allow-uncommitted-changes

      - name: Inspect package files
        run: |
          find . -maxdepth 2 -type f \
            \( -name "${{ env.PLUGIN_DIRECTORY }}.*.zip" -o -name "plugins.xml" \) \
            -print

      - name: Validate generated package
        env:
          PLUGIN_DIRECTORY: ${{ env.PLUGIN_DIRECTORY }}
        run: |
          PACKAGE="$(find . -maxdepth 1 -type f -name "${PLUGIN_DIRECTORY}.*.zip" -print -quit)"

          test -n "${PACKAGE}"
          test -f "plugins.xml"

          unzip -l "${PACKAGE}"

          unzip -l "${PACKAGE}" | grep -q "${PLUGIN_DIRECTORY}/metadata.txt"
          unzip -l "${PACKAGE}" | grep -q "${PLUGIN_DIRECTORY}/LICENSE"

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: qgis2mapbender-package
          path: |
            qgis2mapbender.*.zip
            plugins.xml
          if-no-files-found: error